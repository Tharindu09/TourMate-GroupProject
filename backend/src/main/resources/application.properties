
#Embeded tomcat server port. Change if Port conflict occur
server.port=1200

#MySql server details
spring.datasource.url=jdbc:mysql://localhost:3306/tourmate
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql = true

app.secret=${APP_SECRET}

#Gmail Details
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}

#This is generated by google,  from App Password
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

openrouteservice.api.key=${OPENROUTESERVICE_API_KEY}




