spring:
  application:
    name: tourmate
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/tourmate}
    username: ${DB_USERNAME:tourmate}
    password: ${DB_PASSWORD:tourmate_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: 8080
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
