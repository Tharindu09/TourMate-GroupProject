name: tourmate-rebuild
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tourmate}
      MYSQL_USER: ${MYSQL_USER:-tourmate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tourmate_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tourmate_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./tourmate-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tourmate}
      DB_USERNAME: ${MYSQL_USER:-tourmate}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tourmate_local}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      CORS_ORIGIN: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./tourmate-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
volumes:
  tourmate_mysql:
