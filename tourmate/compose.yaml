name: tourmate-rebuild
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tourmate}
      MYSQL_USER: ${MYSQL_USER:-tourmate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tourmate_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - tourmate_mysql:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP
          --host=127.0.0.1 --port=3306 --user="$${MYSQL_USER}"
          --database="$${MYSQL_DATABASE}" --execute="SELECT 1" --silent
      start_period: 20s
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./tourmate-backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-tourmate}
      DB_USERNAME: ${MYSQL_USER:-tourmate}
      DB_PASSWORD: ${MYSQL_PASSWORD:-tourmate_local}
      JWT_SECRET: ${JWT_SECRET:?Copy .env.example to .env and set JWT_SECRET}
      CORS_ORIGIN: http://localhost:5173
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_TRAVEL_HOST: ${RAPIDAPI_TRAVEL_HOST:-travel-advisor.p.rapidapi.com}
      RAPIDAPI_BOOKING_HOST: ${RAPIDAPI_BOOKING_HOST:-booking-com18.p.rapidapi.com}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      SPRING_FLYWAY_CONNECT_RETRIES: "10"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
  frontend:
    build: ./tourmate-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5173:80"
volumes:
  tourmate_mysql:
